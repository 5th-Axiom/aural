# Included by host nginx at http scope. IP entry only; other virtual hosts unchanged.
limit_req_zone $binary_remote_addr zone=aural_password:1m rate=6r/m;
server {
    listen 443 ssl;
    server_name 47.108.226.96;
    ssl_certificate /etc/nginx/aural-test-ip.crt;
    ssl_certificate_key /etc/nginx/aural-test-ip.key;
    client_max_body_size 100m;
    auth_request /_aural_access;
    error_page 401 = @aural_login;
    location @aural_login { return 302 /api/test-access; }
    location = /_aural_access {
        internal;
        auth_request off;
        proxy_pass http://127.0.0.1:13001/api/test-access/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }
    location = /api/test-access/check { return 404; }
    location = /api/test-access {
        auth_request off;
        limit_req zone=aural_password burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:13001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /supabase/ {
        # Only this host and the two Aural Docker networks bypass the outer gate.
        # Supabase JWT/RLS validation still applies.
        satisfy any;
        allow 127.0.0.1;
        allow 47.108.226.96;
        allow 192.168.176.0/20;
        allow 192.168.160.0/20;
        deny all;
        proxy_pass http://127.0.0.1:15421/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:13001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }
}
